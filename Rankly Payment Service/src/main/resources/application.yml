server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

razorpay:
  base-url: {RAZORPAY_BASE_URL}
  key-id: ${RAZORPAY_CLIENT_ID}
  key-secret: ${RAZORPAY_CLIENT_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

services:
  product:
    url: ${PRODUCT_BASE_URL}
  ranking:
    url: ${RANKING_BASE_URL}
  submission:
    url: ${SUBMISSION_BASE_URL}

payment:
  http:
    connect-timeout-ms: ${PAYMENT_HTTP_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${PAYMENT_HTTP_READ_TIMEOUT_MS}
